name: Release Obsidian plugin

# 自动发布暂时停用，改为手动触发。
# 原因：package-lock.json 里有一条 git+ssh 传递依赖
# （eslint-plugin，由 obsidian-dev-utils 带入），GitHub Actions 上没有对应
# 的 SSH 凭据，会在 npm install 这一步失败，推送 tag 只会留下失败记录。
# 恢复自动发布的先决条件：让 npm install 不再需要 SSH（换成 https 来源，
# 或移除产生该依赖的 devDependency）。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Build plugin
        run: |
          npm install
          npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          gh release create "$tag" \
            --title="$tag" \
            --draft \
            main.js manifest.json styles.css
